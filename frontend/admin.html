<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ONLY.AIRPODS | Admin</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- ---------- PANTALLA DE LOGIN ---------- -->
    <div class="admin-login" id="login-screen">
        <h2>Panel de Administración</h2>
        <p>ONLY.AIRPODS · acceso restringido</p>
        <input type="password" id="login-password" class="form-control" placeholder="Contraseña" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color);">
        <button class="btn" style="width:100%; padding:12px;" onclick="login()">Entrar</button>
        <p class="admin-error" id="login-error"></p>
    </div>

    <!-- ---------- DASHBOARD (oculto hasta iniciar sesión) ---------- -->
    <div class="admin-wrapper" id="dashboard-screen" style="display:none;">

        <div class="admin-header">
            <h1 style="font-size:2rem;">Productos</h1>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>

        <!-- Añadir producto -->
        <div class="admin-card">
            <h3>Añadir nuevo producto</h3>
            <div class="admin-form-grid">
                <input type="text" id="new-id" class="form-control-admin" placeholder="id (ej: airpods-4)">
                <input type="text" id="new-name" class="form-control-admin" placeholder="Nombre">
                <input type="number" id="new-price" class="form-control-admin" placeholder="Precio">
                <input type="number" id="new-stock" class="form-control-admin" placeholder="Stock">
                <select id="new-category" class="form-control-admin">
                    <option value="airpods">airpods</option>
                    <option value="cases">cases</option>
                    <option value="otros">otros</option>
                </select>
                <input type="text" id="new-image" class="form-control-admin" placeholder="URL de imagen (opcional)">
                <input type="text" id="new-desc" class="form-control-admin full-width" placeholder="Descripción">
                <input type="text" id="new-box" class="form-control-admin full-width" placeholder="Contenido de la caja, separado por comas">
            </div>
            <button class="btn-small btn-save" onclick="createProduct()">+ Crear producto</button>
            <p class="admin-error" id="create-error"></p>
            <p class="admin-success" id="create-success"></p>
        </div>

        <!-- Lista de productos existentes -->
        <div class="admin-card">
            <h3>Inventario actual</h3>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- admin.js llena esto dinámicamente -->
                    </tbody>
                </table>
            </div>
            <p class="admin-error" id="table-error"></p>
        </div>
    </div>

    <style>
        .form-control-admin {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }
    </style>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
